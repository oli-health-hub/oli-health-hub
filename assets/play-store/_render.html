<!doctype html>
<html><head><meta charset="utf-8"><style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  .canvas{width:1024px;height:500px;position:relative;overflow:hidden;
    background:linear-gradient(135deg,#5F7D67 0%,#3E5444 100%);
    color:#F4EFEA;
    font-family:Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .blob{position:absolute;border-radius:50%;background:#fff;opacity:.04}
  .b1{width:360px;height:360px;right:-100px;top:-120px}
  .b2{width:280px;height:280px;right:-40px;bottom:-90px;opacity:.03}
  .b3{width:200px;height:200px;left:10px;bottom:-50px;background:#B8893C;opacity:.10}

  .left{position:absolute;left:64px;top:70px;width:520px}
  .logoWrap img{width:230px;height:auto;object-fit:contain;display:block;margin-left:-8px}
  .divider{width:84px;height:5px;background:linear-gradient(90deg,#D4A659,#B8893C);
    border-radius:3px;margin:14px 0 18px}
  .h1{font-size:34px;font-weight:700;line-height:1.22;margin:0;letter-spacing:-.5px}
  .sub{font-size:15px;font-weight:600;opacity:.9;margin-top:16px;letter-spacing:1.5px;line-height:1.8}
  .subPlus{color:#D4A659;font-weight:700;letter-spacing:1px}

  .phone{position:absolute;right:66px;top:50px;width:280px;height:400px;background:#222;
    border-radius:36px;box-shadow:0 16px 40px rgba(0,0,0,.40);overflow:hidden}
  .screen{position:absolute;left:9px;top:9px;width:262px;height:382px;background:#F4EFEA;
    border-radius:28px;padding:46px 20px 0;color:#2F2F2F}
  .notch{position:absolute;left:50%;top:18px;transform:translateX(-50%);
    width:64px;height:12px;background:#222;border-radius:7px;z-index:2}
  .status{font-size:11px;color:#6B6B6B;font-weight:700;margin-bottom:10px}
  .greet{font-size:20px;font-weight:700;margin:0}
  .greetSub{font-size:12px;color:#6B6B6B;margin-top:4px}
  .timer{margin-top:16px;background:linear-gradient(135deg,#5F7D67,#4A6451);
    color:#F4EFEA;padding:14px 16px;border-radius:14px;position:relative}
  .timerLabel{font-size:9.5px;opacity:.88;letter-spacing:1.4px;font-weight:700;margin-bottom:7px}
  .timerVal{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
  .timerBtn{position:absolute;right:14px;top:50%;transform:translateY(-50%);
    width:30px;height:30px;background:#B8893C;border-radius:50%}
  .timerBtn::before{content:"";position:absolute;left:9px;top:9px;width:12px;height:12px;
    background:#F4EFEA;border-radius:2px}
  .upNext{margin-top:16px;font-size:10px;color:#6B6B6B;font-weight:700;letter-spacing:1px}
  .row{margin-top:9px;background:#fff;border:1px solid #E6E0D6;border-radius:11px;
    padding:9px 12px 9px 17px;position:relative}
  .row::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:2px}
  .row.gold::before{background:#B8893C}
  .row.green::before{background:#5F7D67}
  .rowTitle{font-size:13px;font-weight:700;color:#2F2F2F}
  .rowTime{font-size:11px;color:#6B6B6B;margin-top:3px}
</style></head><body>
<div class="canvas">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

  <div class="left">
    <div class="logoWrap"><img src="logo-white.png" alt="OLI Health Hub"/></div>
    <div class="divider"></div>
    <div class="h1">Nosso Hub de Solu&ccedil;&otilde;es<br>em Sa&uacute;de, no seu bolso!</div>
    <div class="sub">SALAS &middot; PACIENTES &middot; FINANCEIRO &middot; AGENDA<br><span class="subPlus">e muito +</span></div>
  </div>

  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <div class="status">9:41</div>
      <div class="greet">Bom dia, Dr.</div>
      <div class="greetSub">Voc&ecirc; tem 3 reservas hoje</div>
      <div class="timer">
        <div class="timerLabel">SESS&Atilde;O ATIVA &middot; SALA 6</div>
        <div class="timerVal">00:42:18</div>
        <div class="timerBtn"></div>
      </div>
      <div class="upNext">PR&Oacute;XIMAS</div>
      <div class="row gold">
        <div class="rowTitle">Sala Digital</div>
        <div class="rowTime">16:30 &ndash; 17:30</div>
      </div>
      <div class="row green">
        <div class="rowTitle">Sala 1 &mdash; amanh&atilde;</div>
        <div class="rowTime">10:00 &ndash; 11:00</div>
      </div>
    </div>
  </div>
</div>
</body></html>
