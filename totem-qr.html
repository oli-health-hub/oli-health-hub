<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OLI Health Hub — Totem de Checkout</title>
  <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, sans-serif;
      background: #F4EFEA;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      max-width: 420px;
      width: 90%;
    }
    .logo {
      font-size: 22px;
      font-weight: 800;
      color: #5F7D67;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 13px;
      color: #6B6B6B;
      margin-bottom: 32px;
    }
    #qrcode {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }
    #qrcode img {
      border-radius: 12px;
      display: block;
    }
    .instruction {
      font-size: 15px;
      color: #2F2F2F;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .hint {
      font-size: 13px;
      color: #6B6B6B;
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      margin-top: 24px;
      background: #5F7D6720;
      color: #5F7D67;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 100px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">OLI Health Hub</div>
    <div class="subtitle">Totem de Checkout — Recepção</div>
    <div id="qrcode"></div>
    <div class="instruction">Aponte a câmera do app para o código</div>
    <div class="hint">Após a leitura, seu checkout será registrado automaticamente.</div>
    <div class="badge">AMBIENTE DE TESTES</div>
  </div>

  <script>
    new QRCode(document.getElementById('qrcode'), {
      text:        'OLI-CHECKOUT:reception-totem-001',
      width:        280,
      height:       280,
      colorDark:   '#5F7D67',
      colorLight:  '#FFFFFF',
      correctLevel: QRCode.CorrectLevel.H,
    });
  </script>
</body>
</html>
